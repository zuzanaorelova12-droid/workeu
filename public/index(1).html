R.alerts=()=>`<main><h1>🔔 Job Alerts</h1><div class="card">${sel('ac1','Country',['Germany','Austria'],'Germany')}${fld('ac2','City','München')}${sel('ac3','Job category',['Warehouse','Production','Packaging'],'Warehouse')}${fld('ac4','Minimum salary €/h','15','number')}${sel('ac5','Language',['German A1','German A2','German B1'],'German A2')}${sel('ac6','Accommodation',['Required','Not needed'],'Required')}<button class="btn big" onclick="S.alert=true;route()">Save alert</button>${S.alert?'<p class="ok"><b>Your alert is active ✓</b></p>':''}</div></main>`;
R.emp=()=>`<main><h1>🏢 For Employers</h1><h2>Need workers in Europe?</h2><p class="m">Find suitable workers faster.</p>${['Post a job','Find candidates','AI candidate matching','Contact workers','Work with staffing partners'].map(x=>`<div class="card row"><b>${x}</b><span class="tag">Coming soon</span></div>`).join('')}<p class="m">Plans from €49 / €99 / €199 per month, plus optional placement fees.</p><button class="btn" onclick="this.textContent='Thanks – we will be in touch ✓'">Join the waitlist</button></main>`;
R.agency=()=>`<main><h1>🤝 For Staffing Agencies</h1>${['Receive job requirements','Find candidates','Manage candidate pipeline','Submit candidates','Communicate with employers','Track placements'].map(x=>`<div class="card row"><b>${x}</b><span class="tag">Coming soon</span></div>`).join('')}<button class="btn" onclick="this.textContent='Thanks – we will be in touch ✓'">Join the waitlist</button></main>`;
const PLAN={price:'4.99',period:'per year'}; /* change price/period here; period can be 'per year' or 'per 3 months' */
R.plans=()=>`<main><h1>⭐ Plans</h1><div class="card" style="border:2px solid var(--a)"><span class="tag">7 days free</span><h3>All services</h3><div class="row" style="justify-content:flex-start;gap:8px;align-items:baseline"><h1>€${PLAN.price}</h1><span class="m">${PLAN.period}</span></div><p class="m">After the free trial.</p>${[t('find'),t('match'),t('mycv'),t('wl'),t('sal'),t('scam'),t('ask'),'Job Alerts'].map(x=>`<p>✓ ${x}</p>`).join('')}<p class="m">Fair use limits apply to AI features.</p>${S.trial?'<p class="ok"><b>Free trial active ✓</b></p>':'<button class="btn big" onclick="S.trial=true;route()">Start free trial (demo)</button>'}</div></main>`;
R.legal=p=>`<main><h1>${{privacy:'Privacy Policy',terms:'Terms',cookies:'Cookie preferences'}[p]||'Legal'}</h1><div class="card"><p>Placeholder page for the MVP. Final text to be provided by legal counsel.</p>${p=='cookies'?'<label><input type="checkbox" checked disabled style="width:auto;min-height:0"> Necessary</label><br><label><input type="checkbox" style="width:auto;min-height:0"> Analytics</label>':''}</div><a href="#/profile">← Profile</a></main>`;

/* ===== Router & shell ===== */
function route(){APPLANG();const h=location.hash.replace(/^#\//,'').split('/'),r=h[0];
 if(S.step<9&&r!=='legal'){$('#app').innerHTML=R.onb();if(S.step>=1){const m=$('#app main');m&&m.insertAdjacentHTML('afterbegin','<button class="btn s back" onclick="S.step--;route()">← '+t('back')+'</button>')}return}
 const fn=R[r];const body=fn?fn(h[1]):err('');const nav=[['','home',t('home')],['jobs','jobs',t('jobs')],['learn','learn',t('learn')],['cv','cv',t('cv')],['profile','profile',t('profile')]];
 $('#app').innerHTML='<header class="tb"><span class="logo">W</span>WorkEU</header>'+body+`<nav class="b" aria-label="Main"><div class="brand"><span class="logo">W</span>WorkEU</div>${nav.map(n=>`<a href="#/${n[0]}" class="${r==n[0]?'on':''}"${r==n[0]?' aria-current="page"':''}><b>${ICO[n[1]]}</b>${n[2]}</a>`).join('')}<div class="me"><span class="av">${E(PROFILE.name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase())}</span><div><b>${E(PROFILE.name)}</b><small>→ ${CODE[S.country]||'EU'}</small></div></div></nav><div class="fab"><a class="ai" href="#" aria-label="${t('ask')}" title="${t('ask')}" onclick="openAI();return false"><span aria-hidden="true">✨</span><span class="lb">${t('ask')}</span></a>${r==='help'?'':`<a href="#/help" aria-label="${t('help')}" title="${t('help')}"><span aria-hidden="true">🆘</span><span class="lb">${t('help')}</span></a>`}</div>`;if(r&&!['jobs','learn','cv','profile','job','apply','legal'].includes(r)){const m=$('#app main');m&&m.insertAdjacentHTML('afterbegin',`<button class="btn s back" onclick="history.length>1?history.back():go('')">← ${t('back')}</button>`)}scrollTo(0,0)}
window.openAI=()=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:#0007;z-index:20;display:flex;align-items:flex-end;justify-content:center';d.innerHTML=`<div class="card" role="dialog" aria-label="Ask WorkEU" style="width:100%;max-width:560px;margin:0;border-radius:22px 22px 0 0;max-height:85vh;overflow:auto"><div class="row"><h3>✨ Ask WorkEU</h3><button class="btn s" onclick="this.closest('[role=dialog]').parentNode.remove()" aria-label="Close">✕</button></div><p>${['What does Schichtarbeit mean?','How do I tell my boss I am sick?','How do I ask about my salary?','What should I say on my first day?','Is €15.80 per hour a good salary?','Is this job suitable for me?'].map(q=>`<button class="btn s" onclick="ask('${q}')">${q}</button>`).join('')}</p><div id="aa" class="chat"></div><input id="aq" placeholder="Ask anything…" onkeydown="if(event.key=='Enter')ask(this.value)"></div>`;document.body.appendChild(d)};
window.ask=async q=>{if(!q)return;$('#aa').innerHTML=`<p class="m">${E(X_(q))}</p>`+skel(1);$('#aa').innerHTML=`<p class="m">${E(X_(q))}</p><p>✨ ${E(X_(await aiService.assistant(q)))}</p>`;$('#aq').value=''};
addEventListener('hashchange',route);route();
</script></body></html>
